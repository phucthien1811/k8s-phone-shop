# Tầng API: Node.js Express, phi trạng thái, có thể nhân bản tùy ý
# ---- RBAC: cho phép backend ĐỌC danh sách Pod và HPA để hiển thị trang "Hậu trường" ----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-read-cluster
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-read-cluster
  namespace: shop
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: shop
roleRef:
  kind: Role
  name: backend-read-cluster
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # cập nhật từng Pod một
      maxUnavailable: 0    # luôn giữ đủ Pod phục vụ -> không gián đoạn
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      terminationGracePeriodSeconds: 20
      containers:
        - name: backend
          image: iristhientiy/phone-shop-backend:v1
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: shop-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: MYSQL_PASSWORD } }
            # Downward API: đưa tên Pod và tên node vào biến môi trường
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }   # HPA tính % CPU dựa trên giá trị requests này
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:                            # chỉ nhận request khi đã kết nối được MySQL
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                             # kiểm tra nhẹ (TCP) để không bị khởi động lại oan khi tải cao
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shop
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
