server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Chuyển mọi request /api/ sang Service "backend" trong cùng namespace.
    # kube-proxy sẽ chia đều request cho các Pod backend đang Ready.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # React là ứng dụng một trang: mọi đường dẫn khác trả về index.html
    location / {
        try_files $uri /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
